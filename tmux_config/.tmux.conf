# Enable mouse interactions.
set-option -g mouse on

# Copy tmux selections to the system clipboard.
set-option -g set-clipboard on

# Keep mouse selections highlighted after copying; press q to exit copy mode.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Copy the selected text with y, like Vim visual mode.
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Preserve OSC 8 hyperlinks for the outer terminal.
set-option -as terminal-features ',*:hyperlinks'

# Show each pane's window and session names at the top.
set-option -g pane-border-status top
set-option -g pane-border-format '#[fg=colour39,bold] #{window_name} : #{session_name} #[default]'

# Show each window's name and Git branch across two bottom status lines.
set-option -g status-position bottom
set-option -g status 2
set-option -g status-style 'bg=colour235,fg=colour245'
set-option -g status-left ''
set-option -g status-right ''
set-option -g window-status-separator ' '
# Flag windows whose agent needs input or has finished, so a background agent is
# visible in the footer. agent_notify.sh sets @agent_state on the agent's window
# and tmux resolves it per window as the status line is drawn. Both status formats
# below reopen their own colours right after the marker, so it ends with a reset.
set-option -g @agent-marker '#{?#{==:#{@agent_state},waiting},#[fg=colour235#,bg=colour214#,bold] ! #[default],#{?#{==:#{@agent_state},done},#[fg=colour235#,bg=colour42#,bold] * #[default],}}'
set-option -g window-status-format '#{E:@agent-marker}#[fg=colour245] #W; #[fg=colour39]#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null) #[default]'
set-option -g window-status-current-format '#{E:@agent-marker}#[fg=colour235,bg=colour39,bold] #W; #(git -C "#{pane_current_path}" branch --show-current 2>/dev/null) #[default]'
set-option -g @window-status-row-break '#(tmux list-windows -t #{q:session_id} | sed -n "#{e|/|:#{e|+|:#{session_windows},1},2}s/:.*//p")'
set-option -g @window-status-first-row '#{e|<=|:#{window_index},#{E:@window-status-row-break}}'
set-option -g @window-status-entry '#[range=window|#{window_index}]#{T:window-status-format}#[norange list=on]#{window-status-separator}'
set-option -g @window-status-current-entry '#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange list=on]#{window-status-separator}'
set-option -g status-format[0] '#[align=left list=on]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{?#{E:@window-status-first-row},#{E:@window-status-entry},},#{?#{E:@window-status-first-row},#{E:@window-status-current-entry},}}#[nolist default]'
# Evaluate status-right so tmux-continuum's invisible autosave hook runs.
set-option -g status-format[1] '#[align=left list=on]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{?#{E:@window-status-first-row},,#{E:@window-status-entry}},#{?#{E:@window-status-first-row},,#{E:@window-status-current-entry}}}#[nolist default]#{T:status-right}'

# Drop a window's finished marker once that window has actually been looked at.
# pane-focus-in covers both switching to a window and WezTerm regaining focus,
# which client-focus-in does not report; session-window-changed is the fallback
# when the outer terminal does not report focus at all. A waiting marker is
# deliberately left in place, because that agent is still blocked until answered.
set-option -g focus-events on
set-hook -g pane-focus-in 'run-shell -b "~/.agent-notify/agent_notify.sh --reviewed #{window_id}"'
set-hook -g session-window-changed 'run-shell -b "~/.agent-notify/agent_notify.sh --reviewed #{window_id}"'

# Prefix + s creates a pane below; Prefix + v creates one beside it. New panes inherit the current pane's directory.
bind-key s split-window -v -c '#{pane_current_path}'
bind-key v split-window -h -c '#{pane_current_path}'

# Prefix + c or w creates a window after the current session's last window.
bind-key c new-window -a -t ':{end}'
bind-key w new-window -a -t ':{end}'

# Prefix + h/j/k/l resizes the selected pane by five cells; keys repeat without re-pressing the prefix.
bind-key -r h resize-pane -L 5
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r l resize-pane -R 5

# Prefix + arrows select the adjacent pane.
bind-key Left select-pane -L
bind-key Down select-pane -D
bind-key Up select-pane -U
bind-key Right select-pane -R

# Prefix + o chooses a window from the current session only.
bind-key o run-shell 'tmux choose-tree -Nwf"##{==:##{session_name},#{session_name}}"'

# Prefix + r renames the current window.
bind-key r command-prompt -I '#W' "rename-window '%%'"

# Persist tmux sessions and restore the latest saved session when tmux starts.
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'
set-option -g @continuum-restore 'on'

# Install TPM and the configured plugins automatically on a new machine.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM; this must remain the final line in the config.
run '~/.tmux/plugins/tpm/tpm'
